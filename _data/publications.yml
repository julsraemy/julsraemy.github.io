# Publications shown on /publications/ and exported to /publications.ris and /publications.bib.
#
# Entries are listed in reverse chronological order within each type. Fields:
#   type          thesis | article | paper | report | chapter | poster | presentation | blog | interview
#   authors       list of "Last, First"
#   year, title   required
#   genre         thesis or report kind, e.g. "PhD dissertation", "White paper"
#   institution   for theses
#   journal       journal or proceedings series, with volume, issue and pages
#   book          title of the edited volume or proceedings, with editors, pages, series
#   blog          name of the blog or website, with blog_suffix (e.g. " (blog)"), publisher and date
#   presented     lead phrase for events (default per type, e.g. "Presentation at")
#   event, place, date
#   venue         free text replacing the generated "presented at" part when it does not fit the pattern
#   publisher, place, version, note
#   url           DOI (as https://doi.org/...) or other link
#   links         extra links shown as buttons, e.g. recordings
#   lang          language flag emoji code shown after the reference
#   selected      true to feature the entry on the homepage

