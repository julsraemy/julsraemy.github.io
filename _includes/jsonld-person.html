{%- comment -%}
  Schema.org description of the site's author, on every page. Publications on /publications/
  point to it through its @id. sameAs reuses the social links from _config.yml.
  With raw=true the <script> wrapper is left out, for /me.json.
{%- endcomment -%}
{%- unless include.raw %}<script type="application/ld+json">{% endunless %}
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}/#person",
  "name": "Julien Antoine Raemy",
  "alternateName": "Julien A. Raemy",
  "url": "{{ site.url }}/",
  "image": "{{ site.url }}/assets/images/portrait-favicon.jpg",
  "jobTitle": "Semantic Architect and Project Manager",
  "worksFor": { "@type": "Organization", "name": "docuteam", "url": "https://www.docuteam.ch/" },
  "affiliation": {
    "@type": "Organization",
    "name": "Walter Benjamin Kolleg / Digital Humanities Center",
    "url": "https://www.dh.unibe.ch/",
    "parentOrganization": {
      "@type": "CollegeOrUniversity",
      "@id": "https://ror.org/02k7v4d05",
      "name": "University of Bern"
    }
  },
  "alumniOf": [
    {
      "@type": "CollegeOrUniversity",
      "@id": "https://ror.org/02s6k3f65",
      "name": "University of Basel"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "Haute école de gestion de Genève",
      "parentOrganization": {
        "@type": "CollegeOrUniversity",
        "@id": "https://ror.org/01xkakk17",
        "name": "HES-SO University of Applied Sciences and Arts Western Switzerland"
      }
    }
  ],
  "memberOf": [
    {
      "@type": "Organization",
      "@id": "https://ror.org/055e01504",
      "name": "International Image Interoperability Framework (IIIF)",
      "url": "https://iiif.io/"
    },
    { "@type": "Organization", "name": "Linked Art", "url": "https://linked.art/" },
    { "@type": "Organization", "name": "ARK Alliance", "url": "https://arks.org/" }
  ],
  "knowsAbout": ["IIIF", "Linked Art", "Linked Open Usable Data (LOUD)", "Linked Data", "Archival Resource Keys (ARKs)", "Records in Contexts (RiC)", "Digital preservation", "Cultural heritage", "Digital humanities"],
  "address": { "@type": "PostalAddress", "addressLocality": "{{ site.author.location | split: ',' | first }}", "addressCountry": "CH" },
  "identifier": { "@type": "PropertyValue", "propertyID": "ORCID", "value": "0000-0002-4711-5759" },
  "sameAs": {{ site.social.links | jsonify }}
}
{%- unless include.raw %}
</script>{% endunless %}
